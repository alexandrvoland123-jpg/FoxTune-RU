  injLayout         = "Схема работы и фазировка форсунок. Варианты: \n 1. Парный - 2 форсунки на выход. Число активных выходов равно половине числа цилиндров. Выходы фазируются на 1 оборот коленвала. \n 2. Полупоследовательный: как парный, но каналы форсунок зеркальны (1&4, 2&3), поэтому число используемых выходов равно числу цилиндров. Только для двигателей до 4 цилиндров. \n 3. Групповой: используются только 2 выхода. \n 4. Последовательный: 1 форсунка на выход, число выходов равно числу цилиндров. Впрыск фазируется на полный цикл. "
