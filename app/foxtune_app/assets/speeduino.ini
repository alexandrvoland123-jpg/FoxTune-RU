[CurveEditor]

;tps-based accel enrichment
      curve = time_accel_tpsdot_curve, "AE по ДПДЗ"
            columnLabel = "TPSdot", "Добавочный"
            xAxis = 0, 1200, 6
            yAxis = 0, 250, 4
            xBins = taeBins, TPSdot
            yBins = taeRates

;map-based accel enrichment
      curve = time_accel_mapdot_curve, "AE по ДАД"
            columnLabel = "MAPdot", "Добавочный"
            xAxis = 0, 1200, 6
            yAxis = 0, 250, 4
            xBins = maeBins, MAPdot
            yBins = maeRates

; Correction curve for dwell vs battery voltage
        curve = dwell_correction_curve, "Коррекция времени накопления по напряжению"
            columnLabel = "Напряжение", "Накопление"
            xAxis = 6, 22, 6
            yAxis = 0, 255, 6
            xBins = brvBins, batteryVoltage
            yBins = dwellRates

; Correction curve for injectors vs battery voltage
        curve = injector_voltage_curve, "Коррекция форсунок по напряжению"
            columnLabel = "Напряжение", "Форсунка"
            xAxis = 6, 22, 6
            yAxis = 0, 255, 6
            xBins = brvBins, batteryVoltage
            yBins = injBatRates

; Curve for injector timing vs RPM
        curve = injector_timing_curve, "Фазировка впрыска"
            columnLabel = "Обороты", "Форсунка"
            xAxis = 0, 7000, 6
            yAxis = 0, 720, 5
            xBins = injAngRPM, rpm
            yBins = injAng

; Correction curve for Air Density vs temperature
        curve = airdensity_curve, "Коррекция по плотности ТВВ"
            columnLabel = "Температура воздуха", "Количество топлива"
            xAxis = -40, 160, 6
            yAxis = 0, 255, 6
            xBins = airDenBins, iat
            yBins = airDenRates

; Correction curve for Barometric pressure fuel adjustment
        curve = baroFuel_curve, "Коррекция топлива по барометрическому давлению"
            topicHelp = "http://wiki.speeduino.com/en/configuration/Barometric_Correction"
            columnLabel = "Барометрическое давление", "Количество топлива"
            xAxis = 75, 112, 6
            yAxis = 0, 255, 6
            xBins = baroFuelBins, baro
            yBins = baroFuelValues

; Correction curve for fuel temperature fuel adjustment
        curve = fuelTemp_curve, "Коррекция топлива по температуре"
            columnLabel = "Температура топлива", "Количество топлива"
            xAxis = -40, 125, 6
            yAxis = 0, 255, 6
            xBins = fuelTempBins, fuelTemp
            yBins = fuelTempValues

; IAT based ignition timing retard
        curve = iat_retard_curve, "Запаздывание зажигания по ТВВ"
            columnLabel =   "Температура впускного воздуха", "Запаздывание"
            #if CELSIUS
            xAxis = 0, 125, 5
            #else
            xAxis = 32, 257, 5
            #endif
            yAxis = 0, 30, 5
            xBins = iatRetBins, iat
            yBins = iatRetRates

; CLT based ignition timing retard
        curve = clt_advance_curve, "Опережение на холодном двигателе"
            columnLabel =   "Температура ОЖ", "Опережение"
            xAxis = -40, 200, 5
            yAxis = -12.7, 12.7, 5
            xBins = cltAdvBins, coolant
            yBins = cltAdvValues

; Idle RPM target based ignition timing
        curve = idle_advance_curve, "Опережение на ХХ"
            columnLabel =   "Разница оборотов", "Опережение"
            xAxis       = -500, 500, 5
            yAxis       =  -15,  50, 5
            xBins       = idleAdvBins, CLIdleDelta
            yBins       = idleAdvValues
            size        = 450, 200

; PWM Fan duty curve based on temp input
        curve = pwm_fan_curve, "Скважность ШИМ вентилятора"
            columnLabel =   "Темп.", "Скважность %"
            xAxis = -40, 215, 4
            yAxis = 0, 100, 4
            xBins = fanPWMBins, coolant
            yBins = PWMFanDuty
            gauge = cltGauge
            size  = 400, 400

; Curves for idle control
        ; Standard duty table for PWM valves
        curve = iacPwm_curve, "Скважность ШИМ РХХ"
            columnLabel = "Температура ОЖ", "Клапан"
        #if CELSIUS
            xAxis = -40, 215, 6
        #else
            xAxis = -40, 315, 6
        #endif
            yAxis = 0, 100, 4
            xBins = iacBins, coolant
            yBins = iacOLPWMVal

        ; Cranking duty table for PWM valves
        curve = iacPwmCrank_curve, "Скважность ШИМ РХХ при прокрутке"
            columnLabel = "Температура ОЖ", "Клапан"
            xAxis = -40, 215, 6
            yAxis = 0, 100, 4
            xBins = iacCrankBins, coolant
            yBins = iacCrankDuty

        curve = iacStep_curve, "Шаговый двигатель РХХ"
            columnLabel = "Температура ОЖ", "Двигатель"
        #if CELSIUS
            xAxis = -40, 215, 6
        #else
            xAxis = -40, 315, 6
        #endif
            yAxis = 0, 850, 4
            xBins = iacBins, coolant
            yBins = iacOLStepVal

        curve = iacStepCrank_curve, "Шаговый двигатель РХХ при прокрутке"
            columnLabel = "Температура ОЖ", "Двигатель"
            xAxis = -40, 120, 6
            yAxis = 0, 850, 4
            xBins = iacCrankBins, coolant
            yBins = iacCrankSteps

        curve = iacClosedLoop_curve, "Целевые обороты ХХ"
            columnLabel = "Температура ОЖ", "Двигатель"
            xAxis = -40, 120, 6
            yAxis = 0, 2000, 4
            xBins = iacBins, coolant
            yBins = iacCLValues
            size  = 450, 200

        curve = rotaryTrailing_curve, "Разделение заднего зажигания роторного двигателя"
            columnLabel = "Нагрузка зажигания", "Градусов разделения"
            yAxis = 0, 40, 4
            xBins = rotarySplitBins, ignLoad
            xAxis = 0, { ignLoadMax }, 5
            yBins = rotarySplitValues

; Warmup enrichment curve
        curve = warmup_curve, "Кривая обогащения при прогреве (WUE)"
            columnLabel = "ОЖ", "WUE %"
            xAxis       = -40, 210, 9
            yAxis       =   0,  240, 6
            xBins       = wueBins, coolant
            yBins       = wueRates
            gauge       = cltGauge

; Cranking enrichment curve
        curve = cranking_enrich_curve, "Кривая обогащения при прокрутке"
          columnLabel = "ОЖ", "Поправка топлива"
          xAxis       = -40, 110, 9
          yAxis       =   0,  400, 6
          xBins       = crankingEnrichBins, coolant
          yBins       = crankingEnrichValues
          ;gauge       = cltGau25

; Priming Pulsewidth curve
        curve = priming_pw_curve, "Длительность праймирующего импульса"
          columnLabel = "ОЖ", "Длительность импульса"
          xAxis       = -40, 110, 4
          yAxis       =   0,  10, 4
          xBins       = primeBins, coolant
          yBins       = primePulse
          gauge       = cltGauge

; Afterstart Enrichment curve
        curve = afterstart_enrichment_curve, "ASE - обогащение %"
          columnLabel = "ОЖ", "Обогащение"
          xAxis       = -40, 110, 4
          yAxis       =   0,  200, 4
          xBins       = aseBins, coolant
          yBins       = asePct
          gauge       = cltGauge

; Afterstart Enrichment time
        curve = afterstart_enrichment_time, "ASE - длительность"
          columnLabel = "ОЖ", "Время"
          xAxis       = -40, 110, 4
          yAxis       =   0,  20, 4
          xBins       = aseBins, coolant
          yBins       = aseCount
          gauge       = cltGauge

; Flex fuel correction curves
        curve = flex_fuel_curve, "Поправки Flex Fuel"
          columnLabel    = "Этанол", "Топливо"
          xAxis          = 0, 100, 10
          yAxis          = 50, 250, 5
          xBins          = flexFuelBins, flex
          yBins          = flexFuelAdj
          size           = 400, 200

        curve = flex_adv_curve, "Опережение зажигания Flex"
          columnLabel     = "Этанол", "Опережение"
          xAxis           = 0, 100, 10
          yAxis           = 0, 50, 5
          xBins           = flexAdvBins, flex
          yBins           = flexAdvAdj
          size            = 400, 200

        curve = flex_boost_curve, "Поправки наддува Flex"
          columnLabel     = "Этанол", "Наддув"
          xAxis           = 0, 100, 10
          yAxis           = -100, 200, 5
          xBins           = flexBoostBins, flex
          yBins           = flexBoostAdj
          size            = 400, 200

;Knock sensor windows
        curve = knock_window_angle_curve, "Окно детонации"
          columnLabel     = "Обороты", "Начало окна"
          xAxis           = 0, 8000, 9
          yAxis           = -100, 100, 11
          xBins           = knock_window_rpms, rpm
          yBins           = knock_window_angle
          size            = 400, 200

        curve = knock_window_duration_curve, "Длительность окна детонации"
          columnLabel     = "Обороты", "Длительность окна"
          xAxis           = 0, 8000, 9
          yAxis           = 0, 100, 10
          xBins           = knock_window_rpms, rpm
          yBins           = knock_window_dur
          size            = 400, 200

; Oil Pressure protection curve
        curve = oil_pressure_prot_curve, "Защита по давлению масла"
          columnLabel     = "Обороты", "Минимум"
          xAxis           = 0, 8000, 9
          #if pressure_bar
            yAxis           = 0, 10.0, 3
          #else
            yAxis           = 0, 150, 3
          #endif
          xBins           = oilPressureProtRPM, rpm
          yBins           = oilPressureProtMins
          size            = 400, 200

; Coolant protection curve
        curve = coolant_prot_curve, "Защита по температуре ОЖ"
          columnLabel     = "ОЖ", "Предел" 
          #if CELSIUS
            xAxis = -40, 140, 5
        #else
            xAxis = -40, 315, 5
        #endif
          yAxis           = 0, 8000, 3
          xBins           = coolantProtTemp, coolant
          yBins           = coolantProtRPM
          size            = 200, 200

  ; Rolling engine protection curve
        curve = rolling_prot_curve, "Процент скользящей отсечки"
          columnLabel     = "Разница оборотов", "Отсечка события" 
          xAxis           = -300, 0, 6
          yAxis           = 0, 125, 6
          xBins           = rollingProtRPMDelta
          yBins           = rollingProtCutPercent
          size            = 200, 200

; Warmup enrichment VEAL AFR adjustment curves
        curve = warmup_afr_curve, "Корректировка цели"
          columnLabel     = "ОЖ", "Смещение"
          xAxis           =  -40,   210, 9
#if LAMBDA
          yAxis           = -0.3, 0.1, 5
#else
          yAxis           =  -4,   1, 5
#endif
          xBins           = wueBins, coolant
          yBins           = wueAFR

        curve = warmup_analyzer_curve, "Обогащение при прогреве"
          columnLabel     = "ОЖ", "Текущий WUE", "ОЖ", "Рекомендуемый WUE"
          xAxis           = -40, 210, 9
          yAxis           = 100, 255, 6
          xBins           = wueBins, coolant
          yBins           = wueRates
          yBins           = wueRecommended
          lineLabel       = "Текущий WUE"
          lineLabel       = "Рекомендуемый WUE"


        curve = wmi_adv_curve, "Опережение зажигания WMI"
          columnLabel     = "кПа", "Опережение"
          xAxis           = 0, 511, 20
          yAxis           = 0, 50, 5
          xBins           = wmiAdvBins, map
          yBins           = wmiAdvAdj
          size            = 400, 200


