[UserDefined]

; Enhanced TunerStudio dialogs can be defined here
; MegaTune will over look this section
; These dialogs will over-ride those in the UserDefined Section
; User defined ar loaded first, then if one by the same name is defined here,
; it will replace the MegaTune definition

; dialog = name,   Title, Layout
;
; valid options for layout are xAxis, yAxis, border
; for an xAxis, each field added will be added from right to left
; A yAxis layout will add fields from top to bottom
; A border layout will expect an additional constraint to determine placement
; valid border constraints are north, South, East, West, Center
; all 5 do not need to be filled.

; The field name can be either a constant reference, or a reference to another
; dialog which will be added.
; dialogs can be nested and can be mixed with fields

    dialog = engine_constants_southwest, "Плата Speeduino"
        field = "!Это критически важная настройка!"
        field = "Выходы НЕ БУДУТ работать, если выбрана неверная плата"
        field = "Схема платы",             pinLayout
        field = "Стехиометрическое соотношение",     stoich
        field = "Схема форсунок",          injLayout
        field = "Объединение форсунок",         inj4CylPairing, {}, { injLayout != 0 && nCylinders == 4 }
        field = "Метод выборки ДАД",        mapSample
        field = "Порог переключения выборки ДАД",  mapSwitchPoint,      { mapSample >= 1 }

    dialog = engine_constants_west, ""
        panel = std_injection, North
        panel = engine_constants_southwest

    dialog = engine_constants_northeast, "Углы неравномерного чередования"
        field = "Угол канала 2", oddfire2,                { engineType == 1 }
        field = "Угол канала 3", oddfire3,                { engineType == 1 && nCylinders >= 3 }
        field = "Угол канала 4", oddfire4,                { engineType == 1 && nCylinders >= 4 }

    dialog = engine_constants_east, ""
        panel = engine_constants_northeast, North
        field = ""

    dialog = engine_constants_warning, ""
        field = "!Предупреждение: у выбранной платы может не хватать каналов для последовательной подачи топлива!", {}, {}, { injLayout == 3 && !sequentialFuelAvailable }

    dialog = engine_constants, "", border
        topicHelp = "http://wiki.speeduino.com/en/configuration/Engine_Constants"
        panel = engine_constants_warning, North
        panel = engine_constants_west, West
        panel = engine_constants_east, East

; Flex fuel stuff
    dialog = flexFuelSettings, "", yAxis
        field = "Датчик Flex Fuel ", flexEnabled
        field = "Низкий (E0) ",         flexFreqLow,  { flexEnabled }
        field = "Высокий (E100) ",      flexFreqHigh, { flexEnabled }
        slider = "Фильтр датчика Flex", FILTER_FLEX, horizontal, { flexEnabled }

    dialog = flexFuelWest, ""
        panel = flex_fuel_curve,     { flexEnabled }
        panel = flex_adv_curve,      { flexEnabled }

    dialog = flexFuelEast, ""
        panel = flex_boost_curve,    { flexEnabled && boostEnabled }

    ;dialog = flexCurves, "", indexCard
    dialog = flexCurves, "", xAxis
        panel = flexFuelWest, West
        panel = flexFuelEast, East

    dialog = flexFuel, "Настройки датчика топлива", border
        topicHelp = "http://wiki.speeduino.com/en/configuration/Flex_Fuel"
        ;panel = flexFuelWest, West
        panel = flexFuelSettings, North
        panel = flexCurves,   South

; Knock control settings
    dialog = knock_windows, "Окна детонации", xAxis
        panel = knock_window_angle_curve, West, { knock_mode }
        panel = knock_window_duration_curve, East, { knock_mode }

    dialog = knock_settings_west, "Настройки", yAxis
        field = "Режим детонации",               knock_mode
        field = "Вывод детонации",                knock_pin,          { knock_mode }
        field = "Детонация активна, когда вывод", knock_trigger,      { knock_mode == 1 }
        field = "Использовать подтяжку к плюсу",               knock_pullup,       { knock_mode == 1 }

    dialog = knock_settings_east, "Обнаружение и реакция"
        field = "#Обнаружение"
        field = "Требуемое число событий детонации",     knock_count,        { knock_mode == 1}
        field = "Требуемый порог детонации", knock_threshold,    { knock_mode == 2}
        field = "Максимальное ДАД",              knock_maxMAP,       { knock_mode }
        field = "Максимальные обороты",              knock_maxRPM,       { knock_mode }
        field = "Мин. время между событиями", knock_stepTime,     { knock_mode }
        
        ;Retard and recovery
        field = "#Уменьшение опережения"
        field = "Макс. суммарное уменьшение",         knock_maxRetard,    { knock_mode }
        field = "Размер первого шага",          knock_firstStep,    { knock_mode }
        field = "Размер дополнительного шага",     knock_stepSize,     { knock_mode }
        field = "Время до восстановления",     knock_duration,     { knock_mode } ;Time before retard starts ending
        
        field = "#Восстановление опережения"
        field = "Время шага восстановления",       knock_recoveryStepTime,     { knock_mode } ;Time between each recovery step
        field = "Размер шага восстановления",       knock_recoveryStep, { knock_mode }

    dialog = knock_settings_top, "", xAxis
        panel = knock_settings_west, West
        panel = knock_settings_east, East

    dialog = knockSettings, "", border
        topicHelp = "http://wiki.speeduino.com/en/configuration/Knock"
        panel = knock_settings_top, North
        ;panel = knock_windows, South

    dialog = vss_gear_1, "", xAxis
        field = "Отношение скорости 1",            vssRatio1
        commandButton = "Задать 1-ю передачу",       cmdVSSratio1, { vssMode > 0 }
    dialog = vss_gear_2, "", xAxis
        field = "Отношение скорости 2",            vssRatio2
        commandButton = "Задать 2-ю передачу",       cmdVSSratio2, { vssMode > 0 }
    dialog = vss_gear_3, "", xAxis
        field = "Отношение скорости 3",            vssRatio3
        commandButton = "Задать 3-ю передачу",       cmdVSSratio3, { vssMode > 0 }
    dialog = vss_gear_4, "", xAxis
        field = "Отношение скорости 4",            vssRatio4
        commandButton = "Задать 4-ю передачу",       cmdVSSratio4, { vssMode > 0 }
    dialog = vss_gear_5, "", xAxis
        field = "Отношение скорости 5",            vssRatio5
        commandButton = "Задать 5-ю передачу",       cmdVSSratio5, { vssMode > 0 }
    dialog = vss_gear_6, "", xAxis
        field = "Отношение скорости 6",            vssRatio6
        commandButton = "Задать 6-ю передачу",       cmdVSSratio6, { vssMode > 0 }

    dialog = vss_gear_detection, "Определение передачи", yAxis
        field = "После установки «Импульсов на км/милю» выше"
        field = "Проедьте на каждой передаче (на любой скорости) и нажмите соответствующую кнопку"
        panel = vss_gear_1
        panel = vss_gear_2
        panel = vss_gear_3
        panel = vss_gear_4
        panel = vss_gear_5
        panel = vss_gear_6

    dialog = vss_calibration, "Калибровка датчика скорости"
        field = "Импульсов на км / отношение датчика скорости",          vssPulsesPerKm, { vssMode > 0 }
        commandButton = "Автокалибровка на 60 км/ч",       cmdVSS60kmh, { vssMode > 0 }
        field = "Коэффициент сглаживания",           vssSmoothing, { vssMode > 0 }
        
    dialog = vssSettings, "", yAxis
        topicHelp = "http://wiki.speeduino.com/en/configuration/VSS"
        field = "Режим входа датчика скорости",           vssMode
        field = "Вывод датчика скорости",                  vssPin,         { vssMode > 1 }
        ;field = "Use Pullup",               vssPullup,      { vssMode > 1 }
        field = "Канал Aux датчика скорости",       vssAuxCh,       { vssMode == 1 }
        
        panel = vss_calibration
        panel = vss_gear_detection

    dialog = tacho, "Тахометр"
        field = "Выходной вывод",               tachoPin
        field = "Режим импульса тахометра",         tachoMode
