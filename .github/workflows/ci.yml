
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: 3.47.5
  DART_VERSION: 3.13.4

jobs:
  core:
    name: Core packages
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d
        with:
          sdk: ${{ env.DART_VERSION }}

      - name: Resolve dependencies
        run: dart pub get

      - name: Analyze
        run: dart analyze packages/foxtune_ini packages/foxtune_protocol packages/foxtune_tune

      - name: Test
        run: bash ./tool/test.sh

  flutter:
    name: Flutter analysis and tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
          pub-cache: true

      - name: Analyze and test transport
        working-directory: packages/foxtune_transport
        run: |
          flutter pub get
          flutter analyze
          flutter test

      - name: Analyze and test app
        working-directory: app/foxtune_app
        run: |
          flutter pub get
          flutter analyze
          flutter test

  build-windows:
    name: Build Windows
    runs-on: windows-latest
    timeout-minutes: 35
    needs: [core, flutter]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
          pub-cache: true

      - name: Build
        working-directory: app/foxtune_app
        run: |
          flutter pub get
          flutter build windows --release

      - name: Package Windows application
        shell: pwsh
        run: |
          $release = "app/foxtune_app/build/windows/x64/runner/Release"
          foreach ($dll in "msvcp140.dll", "vcruntime140.dll", "vcruntime140_1.dll") {
            Copy-Item "$env:SystemRoot\System32\$dll" $release
          }
          Compress-Archive -Path "$release/*" -DestinationPath "FoxTune-Windows-x64.zip"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: FoxTune-Windows-x64
          path: FoxTune-Windows-x64.zip
          if-no-files-found: error
          retention-days: 30

  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: [core, flutter]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
          pub-cache: true

      - name: Build APK
        working-directory: app/foxtune_app
        run: |
          flutter pub get
          flutter build apk --release --target-platform android-arm64

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: FoxTune-Android-APK
          path: app/foxtune_app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30
